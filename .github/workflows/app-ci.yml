name: App CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/app/package-lock.json

      - name: Install dependencies
        run: cd packages/app && npm install

      - name: Type check
        run: cd packages/app && npx tsc --noEmit

      - name: Run tests
        env:
          VITE_AUTH0_DOMAIN: placeholder.auth0.com
          VITE_AUTH0_CLIENT_ID: placeholder-client-id
          VITE_AUTH0_AUDIENCE: https://api.roadmapsnap.local
          VITE_API_URL: http://localhost:4000
        run: cd packages/app && npm test

      - name: Build
        run: cd packages/app && npm run build

      - name: App CI passed
        run: echo '✅ App CI passed'
