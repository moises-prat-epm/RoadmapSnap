name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create config for CI
        run: cp js/config_sample.js js/config.js

      - name: Run tests
        run: npm test

      - name: Run config validation
        run: npm run validate

      - name: Run build
        run: npm run build

      - name: All checks passed
        run: echo '✅ All checks passed'
