name: API CI

on:
  push:
    branches: [main]
    paths: ['packages/api/**', '.github/workflows/api-ci.yml']
  pull_request:
    branches: [main]
    paths: ['packages/api/**', '.github/workflows/api-ci.yml']

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadmapsnap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmapsnap_test
      APP_DATABASE_URL: postgresql://roadmapsnap_app:apppassword@localhost:5432/roadmapsnap_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-create app role
        run: |
          psql postgresql://postgres:postgres@localhost:5432/roadmapsnap_test \
            -c "CREATE ROLE roadmapsnap_app WITH LOGIN PASSWORD 'apppassword' NOSUPERUSER;" \
            || true

      - name: Run migrations
        run: npm run migrate
        working-directory: packages/api

      - name: Run API tests
        run: npm test
        working-directory: packages/api
