<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Roadmap Dashboard</title>
    
    <!-- html2canvas library for PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="css/roadmap.css">
</head>
<body>

<script src="./js/config.js"></script>
<script src="js/roadmap.utils.js"></script>
<script src="js/core/timeline.js"></script>
<script src="js/core/workflow.js"></script>
<script src="js/core/dependencies.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/ui/filterBar.js"></script>
<script src="js/ui/grouping.js"></script>
<script src="js/export/csv.js"></script>
<script src="js/export/json.js"></script>
<script src="js/export/png.js"></script>
<script src="js/ui/dependencyArrows.js"></script>

<script>
// ============================================
// DARK MODE FUNCTIONS
// ============================================
function getStoredTheme() {
    return localStorage.getItem('roadmapsnap-theme') || 'light';
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('roadmapsnap-theme', theme);
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
    renderRoadmap();
}

// Apply stored theme on load
(function initTheme() {
    const storedTheme = getStoredTheme();
    if (storedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();

// ============================================
// DATE RANGE ZOOM FUNCTIONS
// ============================================
let originalTimelineStart = null;
let originalTimelineEnd = null;
let currentZoom = 'all';

function initOriginalTimeline() {
    if (originalTimelineStart === null) {
        originalTimelineStart = CONFIG.TIMELINE.START_MONTH;
        originalTimelineEnd = CONFIG.TIMELINE.END_MONTH;
    }
}

function setDateRange(months) {
    initOriginalTimeline();
    
    const today = parseDate(getTodayDate());
    
    if (months === 'all') {
        // Reset to original range
        CONFIG.TIMELINE.START_MONTH = originalTimelineStart;
        CONFIG.TIMELINE.END_MONTH = originalTimelineEnd;
        currentZoom = 'all';
    } else {
        // Calculate new range centered around today
        const halfMonths = Math.floor(months / 2);
        
        const startDate = new Date(today);
        startDate.setMonth(startDate.getMonth() - halfMonths);
        
        const endDate = new Date(today);
        endDate.setMonth(endDate.getMonth() + halfMonths);
        
        // Format as MM/YYYY
        const formatMonthYear = (date) => {
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${m}/${y}`;
        };
        
        CONFIG.TIMELINE.START_MONTH = formatMonthYear(startDate);
        CONFIG.TIMELINE.END_MONTH = formatMonthYear(endDate);
        currentZoom = months + 'mo';
    }
    
    renderRoadmap();
}

// (Workflow, dependencies, dependency arrows from workflow.js, dependencies.js, dependencyArrows.js)

// ============================================
// UTILITY FUNCTIONS (escapeHtmlAttr used by renderRoadmap)
// ============================================
function escapeHtmlAttr(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// Info icon SVG (for optional link)
const infoIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm9-3.75a.75.75 0 01.75-.75h.008a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75H12a.75.75 0 01-.75-.75V8.25zm.75 2.25a.75.75 0 00-.75.75v4.5c0 .414.336.75.75.75h.008a.75.75 0 00.75-.75v-4.5a.75.75 0 00-.75-.75H12z" clip-rule="evenodd" />
</svg>`;

// Risk icon SVG
const riskIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
</svg>`;

// Render Functions
function renderRoadmap() {
    const months = generateMonths();
    const monthWidth = 100 / months.length;
    const today = parseDate(getTodayDate());
    const todayPosition = calculatePosition(getTodayDate(), months);
    const stats = calculateStats();
    const upcoming = getUpcomingMilestones();
    const visibleSources = getVisibleDataSources();
    const workflow = getWorkflow();
    const statesDef = getStates();
    const milestonesDef = getMilestones();
    const lastMilestoneKey = getLastMilestoneKey();
    const lastState = getLastState();
    const hasGroups = hasAnyGroups(visibleSources);
    
    // Generate month columns
    const monthColumnsHTML = months.map(m => 
        `<div class="month-column">${m.name}</div>`
    ).join('');
    
    // Generate grid lines
    const gridLinesHTML = months.slice(1).map((m, i) => 
        `<div class="month-grid-line" style="left: ${(i + 1) * monthWidth}%;"></div>`
    ).join('');
    
    // Helper function to render a single source row
    function renderSourceRow(source, isGroupItem = false) {
        const status = getCurrentStatus(source);
        const currentState = getStateByKey(status);
        const statusClass = `status-${status.toLowerCase()}`;
        const indicatorClass = status.toLowerCase();
        const atRiskClass = source.atRisk ? 'at-risk' : '';
        const descopedClass = source.descoped ? 'descoped' : '';
        const groupItemClass = isGroupItem ? 'group-item' : '';
        
        // Get state color (use first matching milestone color or default)
        const workflow = getWorkflow();
        const stateIndex = workflow.findIndex(item => item.type === 'state' && item.key === status);
        let stateColor = '#c1c7d0'; // default grey
        // Find the NEXT milestone after this state to get the relevant color
        let foundNext = false;
        for (let i = stateIndex + 1; i < workflow.length; i++) {
            if (workflow[i].type === 'milestone') {
                stateColor = workflow[i].color;
                foundNext = true;
                break;
            }
        }
        // For final state (no next milestone), use a darker shade of the previous milestone's color
        if (!foundNext && stateIndex > 0) {
            for (let i = stateIndex - 1; i >= 0; i--) {
                if (workflow[i].type === 'milestone') {
                    // Darken the color for final state to distinguish from previous state
                    stateColor = darkenColor(workflow[i].color, 0.25);
                    break;
                }
            }
        }
        
        
        // Generate start marker using START milestone date
        // Hide label if position < 2% to avoid overlap with status indicator
        let startMarkerHTML = '';
        const startDate = getMilestoneDate(source, 'START');
        if (startDate && isDateInRange(startDate, months)) {
            const position = calculatePosition(startDate, months);
            const startMilestone = getMilestoneByKey('START');
            const hideLabel = position < 2;
            startMarkerHTML = `
                <div class="milestone-marker start" style="left: ${position}%; background: ${startMilestone?.color || '#6554c0'}; ${hideLabel ? 'min-width: 8px; width: 8px; height: 8px; border-radius: 50%;' : ''}">
                    ${hideLabel ? '' : `<span>${startMilestone?.short || 'GO'}</span><div class="milestone-date">${formatDateDisplay(startDate)}</div>`}
                </div>
            `;
        }
        
        // Generate milestone markers (dynamic) - skip START as it has its own marker
        // Hide label if position < 2% to avoid overlap with status indicator
        const milestonesHTMLArr = milestonesDef.filter(m => m.key !== 'START').map(m => {
            const date = getMilestoneDate(source, m.key);
            
            if (!date || !isDateInRange(date, months)) {
                return '';
            }
            
            const position = calculatePosition(date, months);
            const hideLabel = position < 2;
            
            return `
                <div class="milestone-marker" style="left: ${position}%; background: ${m.color}; ${m.color === '#ffab00' ? 'color: #172b4d;' : ''} ${hideLabel ? 'min-width: 8px; width: 8px; height: 8px; border-radius: 50%;' : ''}">
                    ${hideLabel ? '' : `<span>${m.short}</span><div class="milestone-date">${formatDateDisplay(date)}</div>`}
                </div>
            `;
        }).join('');
        
        // Generate Gantt bar - shows full timeline with colored segments for each phase
        // Works dynamically with any milestone configuration
        // Past portions have full opacity, future portions have reduced opacity
        // Not Started items show full future bar with reduced opacity
        let ganttBarsHTML = '';
        {
            const segments = [];
            
            // Get start date position (using START milestone)
            const startDate = getMilestoneDate(source, 'START');
            const startDatePos = startDate ? calculatePosition(startDate, months) : null;
            
            // Get all milestone positions dynamically
            const milestonePositions = {};
            milestonesDef.forEach(m => {
                const date = getMilestoneDate(source, m.key);
                milestonePositions[m.key] = date ? calculatePosition(date, months) : null;
            });
            
            // Helper function to create a segment, splitting at today if needed
            function createSegment(start, end, color) {
                if (start === null || end === null || end <= start) return;
                
                // If entirely in the past
                if (end <= todayPosition) {
                    segments.push(`<div class="gantt-bar" style="left: ${start}%; width: ${end - start}%; background: ${color};"></div>`);
                }
                // If entirely in the future
                else if (start >= todayPosition) {
                    segments.push(`<div class="gantt-bar gantt-future" style="left: ${start}%; width: ${end - start}%; background: ${color};"></div>`);
                }
                // If spans today - split into two parts
                else {
                    // Past portion (full opacity)
                    const pastWidth = todayPosition - start;
                    if (pastWidth > 0) {
                        segments.push(`<div class="gantt-bar" style="left: ${start}%; width: ${pastWidth}%; background: ${color};"></div>`);
                    }
                    // Future portion (reduced opacity)
                    const futureWidth = end - todayPosition;
                    if (futureWidth > 0) {
                        segments.push(`<div class="gantt-bar gantt-future" style="left: ${todayPosition}%; width: ${futureWidth}%; background: ${color};"></div>`);
                    }
                }
            }
            
            // Generate all segments dynamically based on milestone definitions
            // Each segment from milestone N to milestone N+1 uses milestone N's color
            // First segment (START to first milestone) uses first milestone's color
            for (let i = 0; i < milestonesDef.length; i++) {
                const currentMilestone = milestonesDef[i];
                const currentPos = milestonePositions[currentMilestone.key];
                
                if (i === 0) {
                    // First segment: START to first milestone - use first milestone's color
                    if (currentPos !== null) {
                        const segStart = startDatePos !== null ? startDatePos : Math.max(0, currentPos - 5);
                        createSegment(segStart, currentPos, currentMilestone.color);
                    }
                }
                
                // Segment from current milestone to next milestone
                if (i < milestonesDef.length - 1) {
                    const nextMilestone = milestonesDef[i + 1];
                    const nextPos = milestonePositions[nextMilestone.key];
                    createSegment(currentPos, nextPos, nextMilestone.color);
                }
            }
            
            ganttBarsHTML = segments.join('');
        }
        
        // Risk indicator
        const riskIndicatorHTML = source.atRisk ? 
            `<div class="risk-indicator" title="At Risk">${riskIconSVG}</div>` : '';
        
        // Info link (optional - backwards compatible when link is undefined)
        const infoLinkHTML = (source.link && source.link.trim()) ?
            `<a class="info-link" href="${escapeHtmlAttr(source.link)}" target="_blank" rel="noopener noreferrer" title="More info">${infoIconSVG}</a>` : '';
        
        // Dependency indicator
        const depType = getDependencyType(source);
        const inboundDeps = getInboundDependencies(source);
        const outboundDeps = getOutboundDependencies(source);
        let dependencyIconHTML = '';
        
        if (depType !== 'none') {
            const isActive = activeDependencyGraph === source.name;
            const activeClass = isActive ? 'active' : '';
            let iconSVG = '';
            let tooltip = '';
            
            // Format dependency info with extended milestone details
            // Format dependency info with extended milestone details
            // Default: from last milestone of source, to first milestone of target
            const firstMsKey = getFirstMilestoneKey();
            const formatInboundDep = (dep) => {
                const fromMsKey = dep.from || lastMilestoneKey;
                const toMsKey = dep.to || firstMsKey;
                const fromMsDef = getMilestoneByKey(fromMsKey);
                const toMsDef = getMilestoneByKey(toMsKey);
                const fromShort = fromMsDef?.short || fromMsKey;
                const toShort = toMsDef?.short || toMsKey;
                return `${dep.task} (${fromShort} → ${toShort})`;
            };
            const formatOutboundDep = (dep) => {
                const fromMsKey = dep.from || lastMilestoneKey;
                const toMsKey = dep.to || firstMsKey;
                const fromMsDef = getMilestoneByKey(fromMsKey);
                const toMsDef = getMilestoneByKey(toMsKey);
                const fromShort = fromMsDef?.short || fromMsKey;
                const toShort = toMsDef?.short || toMsKey;
                return `${dep.task} (${fromShort} → ${toShort})`;
            };
            
            if (depType === 'inbound') {
                // Arrow pointing into (blocked by)
                iconSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 3v7H6l6 8 6-8h-3.5V3z"/></svg>`;
                tooltip = `Blocked by:\n${inboundDeps.map(formatInboundDep).join('\n')}`;
            } else if (depType === 'outbound') {
                // Arrow pointing out (blocks)
                iconSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 21v-7H18l-6-8-6 8h3.5v7z"/></svg>`;
                tooltip = `Blocks:\n${outboundDeps.map(formatOutboundDep).join('\n')}`;
            } else if (depType === 'both') {
                // Bidirectional arrow
                iconSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5-5 5 5H7zm0 4l5 5 5-5H7z"/></svg>`;
                tooltip = `Blocked by:\n${inboundDeps.map(formatInboundDep).join('\n')}\n\nBlocks:\n${outboundDeps.map(formatOutboundDep).join('\n')}`;
            }
            
            dependencyIconHTML = `<div class="dependency-icon ${depType} ${activeClass}" title="${tooltip}" onclick="toggleDependencyGraph('${escapeHtmlAttr(source.name)}', event)">${iconSVG}</div>`;
        }
        
        // Dependency highlighting classes
        let dependencyClass = '';
        if (activeDependencyGraph) {
            const graph = getDependencyGraph(activeDependencyGraph);
            if (activeDependencyGraph === source.name) {
                dependencyClass = 'dependency-active';
            } else if (graph.nodes.includes(source.name)) {
                dependencyClass = 'dependency-highlight';
            } else {
                dependencyClass = 'dependency-dimmed';
            }
        }
        
        return `
            <div class="data-source-row ${atRiskClass} ${groupItemClass} ${dependencyClass} ${descopedClass}">
                <div class="source-name ${statusClass}">
                    ${riskIndicatorHTML}
                    <span class="source-name-text">${source.name}</span>
                    ${infoLinkHTML}
                    ${dependencyIconHTML}
                    <span class="status-indicator" style="background: ${stateColor}; ${stateColor === '#ffab00' ? 'color: #172b4d;' : 'color: white;'}" title="${currentState?.title || status}">${currentState?.short || status}</span>
                </div>
                <div class="timeline-track">
                    ${gridLinesHTML}
                    ${filterState.showGantt ? ganttBarsHTML : ''}
                    <div class="today-guide-line" style="left: ${todayPosition}%;"></div>
                    ${startMarkerHTML}
                    ${milestonesHTMLArr}
                </div>
            </div>
        `;
    }
    
    // Chevron SVG for group headers
    const chevronSVG = `<svg class="group-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 01-1.06 0l-7.5-7.5a.75.75 0 011.06-1.06L12 14.69l6.97-6.97a.75.75 0 111.06 1.06l-7.5 7.5z" clip-rule="evenodd" />
    </svg>`;
    
    // Generate data source rows with grouping support
    let dataSourceRowsHTML = '';
    
    if (hasGroups) {
        const { groups, ungrouped } = groupDeliverables(visibleSources);
        const groupOrder = (typeof CONFIG !== 'undefined' && Array.isArray(CONFIG.GROUP_ORDER) && CONFIG.GROUP_ORDER.length) ? CONFIG.GROUP_ORDER : null;
        const sortedGroupNames = groupOrder
            ? Object.keys(groups).sort((a, b) => {
                const i = groupOrder.indexOf(a);
                const j = groupOrder.indexOf(b);
                if (i === -1 && j === -1) return a.localeCompare(b);
                if (i === -1) return 1;
                if (j === -1) return -1;
                return i - j;
            })
            : Object.keys(groups).sort();
        // Render grouped items
        sortedGroupNames.forEach(groupName => {
            const groupSources = groups[groupName];
            const collapsed = groupCollapsedState[groupName] || false;
            const groupStats = getGroupStats(groupSources);
            
            // Group header
            dataSourceRowsHTML += `
                <div class="group-header" onclick="toggleGroup('${escapeHtmlAttr(groupName)}')">
                    <div class="group-header-name">
                        <svg class="group-chevron ${collapsed ? 'collapsed' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 01-1.06 0l-7.5-7.5a.75.75 0 011.06-1.06L12 14.69l6.97-6.97a.75.75 0 111.06 1.06l-7.5 7.5z" clip-rule="evenodd" />
                        </svg>
                        ${groupName}
                        <span class="group-stats">
                            ${groupStats.total} items${groupStats.atRisk > 0 ? ` <span class="group-stats-risk">(${groupStats.atRisk} at risk)</span>` : ''}
                        </span>
                    </div>
                    <div class="group-header-track"></div>
                </div>
            `;
            
            // Group items (if not collapsed)
            if (!collapsed) {
                groupSources.forEach(source => {
                    dataSourceRowsHTML += renderSourceRow(source, true);
                });
            }
        });
        
        // Render ungrouped items at the end
        ungrouped.forEach(source => {
            dataSourceRowsHTML += renderSourceRow(source, false);
        });
    } else {
        // No groups - render all items normally
        visibleSources.forEach(source => {
            dataSourceRowsHTML += renderSourceRow(source, false);
        });
    }
    
    // Helper function for breakdown text
    function getBreakdownText(status) {
        const visible = stats.visibleByStatus[status];
        const hidden = stats.hiddenByStatus[status];
        if (hidden > 0) {
            return `${visible} shown + ${hidden} hidden`;
        }
        return '';
    }
    
    // Config-driven labels for generic usage
    const entityPlural = (CONFIG.ENTITY_LABELS && CONFIG.ENTITY_LABELS.plural) || "Items";
    const entityScopeLabel = (CONFIG.ENTITY_LABELS && CONFIG.ENTITY_LABELS.scopeLabel) || entityPlural.toLowerCase();
    const columnHeaderLabel = (CONFIG.ENTITY_LABELS && (CONFIG.ENTITY_LABELS.columnHeader || CONFIG.ENTITY_LABELS.singular)) || "Item";
    const dashboardTitle = (CONFIG.DASHBOARD_TEXT && CONFIG.DASHBOARD_TEXT.title) || "Roadmap Dashboard";
    const totalSubtitleSuffix = (CONFIG.DASHBOARD_TEXT && CONFIG.DASHBOARD_TEXT.totalSubtitleSuffix) || "in scope";
    
    // Get total visible for filter results display (only count filterable deliverables)
    const allVisible = getAllVisibleDataSources();
    const filterableSources = visibleSources.filter(s => !isDeliverableNonFilterable(s));
    const allFilterableVisible = allVisible.filter(s => !isDeliverableNonFilterable(s));
    const filteredCount = filterableSources.length;
    const totalVisible = allFilterableVisible.length;
    const hasActiveFilters = filterState.status !== 'ALL' || filterState.riskOnly || filterState.search;
    const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
    
    // Build HTML
    const roadmapHTML = `
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <button class="filter-toggle ${filterState.showGantt ? 'active' : ''}" onclick="toggleGanttBars()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    Gantt Bars
                </button>
            </div>
            <div class="filter-group">
                <input type="text" class="filter-input" placeholder="Search by name..." 
                       value="${escapeHtmlAttr(filterState.search)}"
                       oninput="updateFilter('search', this.value)">
            </div>
            <div class="filter-group">
                <span class="filter-label">Sort:</span>
                <select class="filter-select" onchange="updateFilter('sortBy', this.value)">
                    <option value="name" ${filterState.sortBy === 'name' ? 'selected' : ''}>Name</option>
                    <option value="status" ${filterState.sortBy === 'status' ? 'selected' : ''}>Status</option>
                    <option value="m3date" ${filterState.sortBy === 'm3date' ? 'selected' : ''}>${lastMilestoneKey} Date</option>
                    <option value="risk" ${filterState.sortBy === 'risk' ? 'selected' : ''}>Risk</option>
                </select>
                <select class="filter-select" onchange="updateFilter('sortOrder', this.value)">
                    <option value="asc" ${filterState.sortOrder === 'asc' ? 'selected' : ''}>Asc</option>
                    <option value="desc" ${filterState.sortOrder === 'desc' ? 'selected' : ''}>Desc</option>
                </select>
            </div>
            ${hasActiveFilters ? `<button class="filter-clear" onclick="clearFilters()">Clear Filters</button>` : ''}
            ${hasGroups ? `
            <div class="group-controls">
                <button class="group-control-btn" onclick="expandAllGroups()">Expand All</button>
                <button class="group-control-btn" onclick="collapseAllGroups()">Collapse All</button>
            </div>
            ` : ''}
            <div class="zoom-controls">
                <span class="filter-label">Zoom:</span>
                <button class="zoom-btn ${currentZoom === '3mo' ? 'active' : ''}" onclick="setDateRange(3)">3mo</button>
                <button class="zoom-btn ${currentZoom === '6mo' ? 'active' : ''}" onclick="setDateRange(6)">6mo</button>
                <button class="zoom-btn ${currentZoom === '12mo' ? 'active' : ''}" onclick="setDateRange(12)">12mo</button>
                <button class="zoom-btn ${currentZoom === 'all' ? 'active' : ''}" onclick="setDateRange('all')">All</button>
            </div>
            <div class="filter-results">
                Showing <strong>${filteredCount}</strong> of <strong>${totalVisible}</strong> ${entityScopeLabel}
            </div>
        </div>
        
        <!-- Export Controls -->
        <div class="export-controls">
            <button class="export-btn" onclick="exportToPNG('roadmap-export', 'Full-Roadmap')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Export Full Roadmap
            </button>
            <button class="export-btn secondary" onclick="exportToPNG('summary-section', 'Summary-Dashboard')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                Export Summary Only
            </button>
            <button class="export-btn secondary" onclick="exportToPNG('timeline-section', 'Timeline-Only')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Export Timeline Only
            </button>
            <button class="export-btn secondary" onclick="exportToCSV()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                CSV
            </button>
            <button class="export-btn secondary" onclick="exportToJSON()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
                </svg>
                JSON
            </button>
            <button class="theme-toggle" onclick="toggleTheme()">
                ${isDarkMode ? 
                    `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    Light Mode` : 
                    `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    Dark Mode`}
            </button>
            <span class="export-note">Export different views for your presentation</span>
        </div>
        
        <!-- Full Roadmap Container -->
        <div class="roadmap-container" id="roadmap-export">
            
            <!-- Summary Dashboard Section -->
            <div class="summary-dashboard" id="summary-section">
                <div class="summary-header">
                    <div class="summary-title">
                        ${dashboardTitle}
                        <span class="summary-title-note">(${stats.total} total ${entityScopeLabel}, ${stats.visible} shown in timeline)</span>
                    </div>
                    <div class="header-right">
                        ${stats.atRisk > 0 ? `
                        <div class="risk-summary clickable ${filterState.riskOnly ? 'active' : ''}" onclick="toggleRiskFilter(event)" title="Click to filter At Risk items">
                            <span class="risk-summary-icon">${riskIconSVG}</span>
                            <span class="risk-summary-text">${stats.atRisk} At Risk</span>
                        </div>
                        ` : ''}
                        <div class="today-date-container">
                            <span class="today-date-label">Today:</span>
                            <span class="today-date-value">${formatShortDate(getTodayDate())}</span>
                        </div>
                    </div>
                </div>
                
                <!-- KPI Cards (Dynamic - by STATE) -->
                <div class="kpi-section" style="grid-template-columns: repeat(${1 + statesDef.length}, 1fr);">
                    <div class="kpi-card total">
                        <div class="kpi-value">${stats.total}</div>
                        <div class="kpi-label">Total ${entityPlural}</div>
                        <div class="kpi-sublabel">${totalSubtitleSuffix}</div>
                        ${stats.hidden > 0 ? `<div class="kpi-breakdown">${stats.visible} shown + ${stats.hidden} hidden</div>` : ''}
                    </div>
                    ${statesDef.map((s, index) => {
                        // Get color for this state (from the NEXT milestone in workflow, or darkened previous for final state)
                        let stateColor = '#c1c7d0'; // default grey
                        const stateIndex = workflow.indexOf(s);
                        let foundNext = false;
                        for (let i = stateIndex + 1; i < workflow.length; i++) {
                            if (workflow[i].type === 'milestone') {
                                stateColor = workflow[i].color;
                                foundNext = true;
                                break;
                            }
                        }
                        // For final state (no next milestone), use a darker shade of the previous milestone's color
                        if (!foundNext && stateIndex > 0) {
                            for (let i = stateIndex - 1; i >= 0; i--) {
                                if (workflow[i].type === 'milestone') {
                                    stateColor = darkenColor(workflow[i].color, 0.25);
                                    break;
                                }
                            }
                        }
                        return `
                    <div class="kpi-card clickable ${filterState.status === s.key ? 'active' : ''}" style="border-left: 4px solid ${stateColor};" onclick="filterByStatus('${s.key}', event)">
                        <div class="kpi-value" style="color: ${stateColor};">${stats[s.key] || 0}</div>
                        <div class="kpi-label">${s.title}</div>
                        <div class="kpi-sublabel">${s.description || ''}</div>
                        ${getBreakdownText(s.key) ? `<div class="kpi-breakdown">${getBreakdownText(s.key)}</div>` : ''}
                    </div>`;
                    }).join('')}
                </div>
                
                <!-- Progress Bar (Dynamic - by STATE) -->
                <div class="progress-section">
                    <div class="progress-header">
                        <div class="progress-title">Overall Progress (All ${stats.total} ${entityPlural})</div>
                        <div class="progress-percentage">${stats.productionReadyPercentage}% ${lastState.title}</div>
                    </div>
                    <div class="progress-bar-container">
                        ${statesDef.map((s, index) => {
                            const count = stats[s.key] || 0;
                            // Get color for this state (from the NEXT milestone in workflow, or darkened previous for final state)
                            let stateColor = '#c1c7d0'; // default grey
                            const stateIndex = workflow.indexOf(s);
                            let foundNext = false;
                            for (let i = stateIndex + 1; i < workflow.length; i++) {
                                if (workflow[i].type === 'milestone') {
                                    stateColor = workflow[i].color;
                                    foundNext = true;
                                    break;
                                }
                            }
                            // For final state (no next milestone), use a darker shade of the previous milestone's color
                            if (!foundNext && stateIndex > 0) {
                                for (let i = stateIndex - 1; i >= 0; i--) {
                                    if (workflow[i].type === 'milestone') {
                                        stateColor = darkenColor(workflow[i].color, 0.25);
                                        break;
                                    }
                                }
                            }
                            const textColor = stateColor === '#ffab00' || stateColor === '#c1c7d0' ? '#172b4d' : 'white';
                            // Highlight filtered state, fade others when filtering
                            const isFiltering = filterState.status && filterState.status !== 'ALL';
                            const isActiveFilter = filterState.status === s.key;
                            const segmentOpacity = isFiltering ? (isActiveFilter ? '1' : '0.3') : '1';
                            return `<div class="progress-segment" style="width: ${(count / stats.total) * 100}%; background: ${stateColor}; color: ${textColor}; opacity: ${segmentOpacity};">${count > 0 ? count : ''}</div>`;
                        }).join('')}
                    </div>
                    <div class="progress-legend">
                        ${statesDef.map((s, index) => {
                            let stateColor = '#c1c7d0';
                            const stateIndex = workflow.indexOf(s);
                            let foundNext = false;
                            for (let i = stateIndex + 1; i < workflow.length; i++) {
                                if (workflow[i].type === 'milestone') {
                                    stateColor = workflow[i].color;
                                    foundNext = true;
                                    break;
                                }
                            }
                            // For final state (no next milestone), use a darker shade of the previous milestone's color
                            if (!foundNext && stateIndex > 0) {
                                for (let i = stateIndex - 1; i >= 0; i--) {
                                    if (workflow[i].type === 'milestone') {
                                        stateColor = darkenColor(workflow[i].color, 0.25);
                                        break;
                                    }
                                }
                            }
                            return `
                        <div class="progress-legend-item">
                            <div class="progress-legend-dot" style="background: ${stateColor};"></div>
                            <span>${s.short} ${s.title}</span>
                        </div>`;
                        }).join('')}
                    </div>
                </div>
                
                <!-- Upcoming Milestones (Dynamic) -->
                <div class="key-milestones" style="grid-template-columns: repeat(${milestonesDef.length}, 1fr);">
                    ${milestonesDef.map(m => {
                        const upcomingItem = upcoming[m.key];
                        return `
                    <div class="milestone-card">
                        <div class="milestone-card-header">
                            <div class="milestone-card-icon" style="background: ${m.color}; ${m.color === '#ffab00' ? 'color: #172b4d;' : ''}">${m.short}</div>
                            <div>
                                <div class="milestone-card-title">Next ${m.title}</div>
                                <div class="milestone-card-subtitle">${m.subtitle || ''}</div>
                            </div>
                        </div>
                        <div class="milestone-card-content">
                            ${upcomingItem ? `<span class="milestone-card-date">${formatShortDate(upcomingItem.date)}</span> - <span class="milestone-card-source">${upcomingItem.source}</span>${upcomingItem.atRisk ? ' ⚠️' : ''}` : `All ${m.title.toLowerCase()} complete`}
                        </div>
                    </div>`;
                    }).join('')}
                </div>
            </div>
            
            <!-- Timeline Section -->
            <div id="timeline-section">
                <!-- State Legend -->
                <div class="state-legend">
                    <div class="state-legend-items">
                        ${statesDef.map((s, index) => {
                            // Get color for this state (from the NEXT milestone in workflow, or darkened previous for final state)
                            let stateColor = '#c1c7d0'; // default grey
                            const stateIndex = workflow.indexOf(s);
                            let foundNext = false;
                            for (let i = stateIndex + 1; i < workflow.length; i++) {
                                if (workflow[i].type === 'milestone') {
                                    stateColor = workflow[i].color;
                                    foundNext = true;
                                    break;
                                }
                            }
                            // For final state (no next milestone), use a darker shade of the previous milestone's color
                            if (!foundNext && stateIndex > 0) {
                                for (let i = stateIndex - 1; i >= 0; i--) {
                                    if (workflow[i].type === 'milestone') {
                                        stateColor = darkenColor(workflow[i].color, 0.25);
                                        break;
                                    }
                                }
                            }
                            const textColor = stateColor === '#ffab00' || stateColor === '#c1c7d0' ? '#172b4d' : 'white';
                            return `
                        <div class="state-legend-item">
                            <span class="state-legend-badge" style="background: ${stateColor}; color: ${textColor};">${s.short}</span>
                            <span class="state-legend-label">${s.title}</span>
                        </div>`;
                        }).join('')}
                    </div>
                    <div class="state-legend-info">
                        Timeline: <span class="state-legend-info-count">${months[0].name}</span> - <span class="state-legend-info-count">${months[months.length - 1].name}</span>
                    </div>
                </div>
                
                <!-- Compact Roadmap -->
                <div class="roadmap-content">
                    <div class="roadmap-grid">
                        
                        <!-- Timeline Header -->
                        <div class="timeline-header">
                            <div class="timeline-label">${columnHeaderLabel}</div>
                            <div class="timeline-months">
                                ${monthColumnsHTML}
                                <div class="today-pointer" style="left: ${todayPosition}%;">
                                    <div class="today-pointer-arrow"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Data Source Rows -->
                        ${dataSourceRowsHTML}
                        
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- Footer -->
        <footer class="page-footer">
            © 2026 RoadmapSnap · Licensed under the <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener">MIT License</a>
        </footer>
        <footer class="build-version" aria-label="Build version">
            v${typeof CONFIG !== 'undefined' ? (CONFIG.VERSION || '?') : '?'} · Build ${typeof CONFIG !== 'undefined' ? (CONFIG.BUILD_DATE || '') : ''}
        </footer>
    `;
    
    document.body.innerHTML = roadmapHTML;
}

// (exportToPNG from js/export/png.js)

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    renderRoadmap();
    // Add click listener to clear status filter when clicking outside KPI cards
    document.addEventListener('click', clearStatusFilterOnOutsideClick);
    // Add click listener to clear dependency graph when clicking outside
    document.addEventListener('click', clearDependencyGraphOnClickOutside);
});
</script>

</body>
</html>
