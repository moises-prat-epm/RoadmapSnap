<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Roadmap Dashboard</title>
    
    <!-- html2canvas library for PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="css/roadmap.css">
</head>
<body>

<script src="./js/config.js"></script>
<script src="js/roadmap.utils.js"></script>

<script>
// ============================================
// FILTER & SORT STATE
// ============================================
let filterState = {
    status: 'ALL',
    riskOnly: false,
    search: '',
    sortBy: 'name',
    sortOrder: 'asc',
    showGantt: true
};

// ============================================
// FILTER & SORT FUNCTIONS
// ============================================
function filterDeliverables(sources) {
    return sources.filter(source => {
        const isNonFilterable = isDeliverableNonFilterable(source);
        // 1️⃣ If status KPI filter is active → hide non-filterable groups
        if (filterState.status !== 'ALL' && isNonFilterable) {
            return false;
        }
        
        // 2️⃣ Apply risk filter globally (to everyone)
        if (filterState.riskOnly && !source.atRisk) {
            return false;
        }
        
        // Status filter
        if (filterState.status !== 'ALL') {
            const status = getCurrentStatus(source);
            if (status !== filterState.status) return false;
        }
        
        // Risk filter
        if (filterState.riskOnly && !source.atRisk) return false;
        
        // Search filter
        if (filterState.search) {
            const searchLower = filterState.search.toLowerCase();
            const nameMatch = source.name.toLowerCase().includes(searchLower);
            const tagsMatch = source.tags && source.tags.some(tag => 
                tag.toLowerCase().includes(searchLower)
            );
            if (!nameMatch && !tagsMatch) return false;
        }
        
        return true;
    });
}

function sortDeliverables(sources) {
    const sorted = [...sources];
    const states = getStates();
    const lastMilestoneKey = getLastMilestoneKey();
    
    sorted.sort((a, b) => {
        let comparison = 0;
        
        switch (filterState.sortBy) {
            case 'name':
                comparison = a.name.localeCompare(b.name);
                break;
            case 'status':
                // Sort by state order from workflow
                const statusOrder = states.map(s => s.key);
                const statusA = statusOrder.indexOf(getCurrentStatus(a));
                const statusB = statusOrder.indexOf(getCurrentStatus(b));
                comparison = statusA - statusB;
                break;
            case 'm3date':
                // Use the last milestone date for sorting
                const dateA = parseDate(getMilestoneDate(a, lastMilestoneKey)) || new Date(9999, 11, 31);
                const dateB = parseDate(getMilestoneDate(b, lastMilestoneKey)) || new Date(9999, 11, 31);
                comparison = dateA - dateB;
                break;
            case 'risk':
                comparison = (b.atRisk ? 1 : 0) - (a.atRisk ? 1 : 0);
                break;
        }
        
        return filterState.sortOrder === 'desc' ? -comparison : comparison;
    });
    
    return sorted;
}

function updateFilter(key, value) {
    filterState[key] = value;
    
    // For search input, debounce and preserve focus
    if (key === 'search') {
        clearTimeout(window.searchDebounceTimer);
        window.searchDebounceTimer = setTimeout(() => {
            renderRoadmap();
            // Restore focus to search input
            const searchInput = document.querySelector('.filter-input');
            if (searchInput) {
                searchInput.focus();
                searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
            }
        }, 150);
    } else {
        renderRoadmap();
    }
}

function clearFilters() {
    filterState = {
        status: 'ALL',
        riskOnly: false,
        search: '',
        sortBy: 'name',
        sortOrder: 'asc',
        showGantt: true
    };
    renderRoadmap();
}

function filterByStatus(status, event) {
    // Prevent event bubbling so body click doesn't immediately clear
    if (event) event.stopPropagation();
    
    // Toggle: if already filtering by this status, clear it
    if (filterState.status === status) {
        filterState.status = 'ALL';
    } else {
        filterState.status = status;
    }
    // Clear risk filter when selecting a status filter
    filterState.riskOnly = false;
    renderRoadmap();
}

function clearStatusFilterOnOutsideClick(event) {
    // Check if click was outside KPI cards and risk summary
    const clickedKpi = event.target.closest('.kpi-card.clickable');
    const clickedRiskSummary = event.target.closest('.risk-summary.clickable');
    if (!clickedKpi && !clickedRiskSummary && (filterState.status !== 'ALL' || filterState.riskOnly)) {
        filterState.status = 'ALL';
        filterState.riskOnly = false;
        renderRoadmap();
    }
}

function toggleRiskFilter(event) {
    if (event) event.stopPropagation();
    filterState.riskOnly = !filterState.riskOnly;
    renderRoadmap();
}

function toggleGanttBars() {
    filterState.showGantt = !filterState.showGantt;
    renderRoadmap();
    
    // Redraw dependency arrows if active (they need to be redrawn after render)
    if (activeDependencyGraph) {
        setTimeout(() => drawDependencyArrows(), 50);
    }
}

// ============================================
// GROUPING FUNCTIONS
// ============================================
let groupCollapsedState = {};

function groupDeliverables(sources) {
    const groups = {};
    const ungrouped = [];
    
    sources.forEach(source => {
        const groupName = source.group || null;
        if (groupName) {
            if (!groups[groupName]) {
                groups[groupName] = [];
            }
            groups[groupName].push(source);
        } else {
            ungrouped.push(source);
        }
    });
    
    return { groups, ungrouped };
}

function hasAnyGroups(sources) {
    return sources.some(source => source.group);
}

function toggleGroup(groupName) {
    groupCollapsedState[groupName] = !groupCollapsedState[groupName];
    renderRoadmap();
}

function expandAllGroups() {
    const sources = CONFIG.DELIVERABLES;
    sources.forEach(source => {
        if (source.group) {
            groupCollapsedState[source.group] = false;
        }
    });
    renderRoadmap();
}

function collapseAllGroups() {
    const sources = CONFIG.DELIVERABLES;
    sources.forEach(source => {
        if (source.group) {
            groupCollapsedState[source.group] = true;
        }
    });
    renderRoadmap();
}

function getGroupStats(sources) {
    const atRiskCount = sources.filter(s => s.atRisk).length;
    return {
        total: sources.length,
        atRisk: atRiskCount
    };
}

function expandGroupsForDependencyGraph(graphNodes) {
    const sources = CONFIG.DELIVERABLES;
    
    sources.forEach(source => {
        if (graphNodes.includes(source.name) && source.group) {
            groupCollapsedState[source.group] = false;
        }
    });
}

// ============================================
// DARK MODE FUNCTIONS
// ============================================
function getStoredTheme() {
    return localStorage.getItem('roadmapsnap-theme') || 'light';
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('roadmapsnap-theme', theme);
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
    renderRoadmap();
}

// Apply stored theme on load
(function initTheme() {
    const storedTheme = getStoredTheme();
    if (storedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();

// ============================================
// DATE RANGE ZOOM FUNCTIONS
// ============================================
let originalTimelineStart = null;
let originalTimelineEnd = null;
let currentZoom = 'all';

function initOriginalTimeline() {
    if (originalTimelineStart === null) {
        originalTimelineStart = CONFIG.TIMELINE.START_MONTH;
        originalTimelineEnd = CONFIG.TIMELINE.END_MONTH;
    }
}

function setDateRange(months) {
    initOriginalTimeline();
    
    const today = parseDate(getTodayDate());
    
    if (months === 'all') {
        // Reset to original range
        CONFIG.TIMELINE.START_MONTH = originalTimelineStart;
        CONFIG.TIMELINE.END_MONTH = originalTimelineEnd;
        currentZoom = 'all';
    } else {
        // Calculate new range centered around today
        const halfMonths = Math.floor(months / 2);
        
        const startDate = new Date(today);
        startDate.setMonth(startDate.getMonth() - halfMonths);
        
        const endDate = new Date(today);
        endDate.setMonth(endDate.getMonth() + halfMonths);
        
        // Format as MM/YYYY
        const formatMonthYear = (date) => {
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${m}/${y}`;
        };
        
        CONFIG.TIMELINE.START_MONTH = formatMonthYear(startDate);
        CONFIG.TIMELINE.END_MONTH = formatMonthYear(endDate);
        currentZoom = months + 'mo';
    }
    
    renderRoadmap();
}

// ============================================
// DATA EXPORT FUNCTIONS (CSV/JSON)
// ============================================
function exportToCSV() {
    const milestones = getMilestones();
    const headers = ['Name', 'Group', 'Current State', 'Next Milestone', 'At Risk', 'Tags', 'Link'];
    milestones.forEach(m => headers.push(`${m.key} Date`));
    
    const rows = [headers.join(',')];
    
    CONFIG.DELIVERABLES.forEach(source => {
        const status = getCurrentStatus(source);
        const currentState = getStateByKey(status);
        const nextMilestone = getNextMilestone(source);
        const row = [
            `"${(source.name || '').replace(/"/g, '""')}"`,
            `"${source.group || ''}"`,
            currentState ? `${currentState.short} - ${currentState.title}` : status,
            nextMilestone ? nextMilestone.short : 'Complete',
            source.atRisk ? 'Yes' : 'No',
            `"${(source.tags || []).join('; ')}"`,
            `"${source.link || ''}"`
        ];
        milestones.forEach(m => {
            row.push(getMilestoneDate(source, m.key) || '');
        });
        rows.push(row.join(','));
    });
    
    const csvContent = rows.join('\n');
    downloadFile(csvContent, 'deliverables.csv', 'text/csv');
}

function exportToJSON() {
    const exportData = {
        exportDate: new Date().toISOString(),
        timeline: CONFIG.TIMELINE,
        workflow: getWorkflow(),
        states: getStates(),
        milestones: getMilestones(),
        deliverables: CONFIG.DELIVERABLES.map(source => {
            const currentState = getStateByKey(getCurrentStatus(source));
            const nextMilestone = getNextMilestone(source);
            return {
                ...source,
                currentState: currentState ? { key: currentState.key, title: currentState.title } : null,
                nextMilestone: nextMilestone ? { key: nextMilestone.key, title: nextMilestone.title } : null
            };
        })
    };
    
    const jsonContent = JSON.stringify(exportData, null, 2);
    downloadFile(jsonContent, 'deliverables.json', 'application/json');
}

function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    URL.revokeObjectURL(url);
}

// ============================================
// WORKFLOW: STATES & MILESTONES
// ============================================
// The WORKFLOW defines the sequence: state -> milestone -> state -> milestone -> ... -> final state
// States represent the current phase; Milestones are transition points with dates.

// darkenColor from roadmap.utils.js

function getWorkflow() {
    // Return CONFIG.WORKFLOW if defined, otherwise fall back to legacy format
    if (CONFIG.WORKFLOW && Array.isArray(CONFIG.WORKFLOW)) {
        return CONFIG.WORKFLOW;
    }
    
    // Legacy fallback: convert old MILESTONES format to new WORKFLOW format
    const legacyMilestones = CONFIG.MILESTONES || [
        { key: 'M0', short: 'M0', title: 'Dev Complete', subtitle: '', color: '#8993a4' },
        { key: 'M1', short: 'M1', title: 'Deployed', subtitle: '', color: '#ffab00' },
        { key: 'M2', short: 'M2', title: 'Ready', subtitle: '', color: '#36b37e' },
        { key: 'M3', short: 'M3', title: 'Complete', subtitle: '', color: '#0065ff' }
    ];
    
    // Build a simple workflow from legacy format
    const workflow = [
        { type: 'state', key: 'NS', short: 'NS', title: 'Not Started', description: 'Pending kickoff' },
        { type: 'milestone', key: 'START', short: 'START', title: 'Start', subtitle: 'Kickoff', color: '#6554c0' },
        { type: 'state', key: 'DEV', short: 'DEV', title: 'In Development', description: 'Active development' }
    ];
    
    legacyMilestones.forEach((m, index) => {
        workflow.push({ type: 'milestone', key: m.key, short: m.short, title: m.title, subtitle: m.subtitle, color: m.color });
        // Add a state after each milestone (except possibly the last one)
        if (index < legacyMilestones.length - 1) {
            workflow.push({ type: 'state', key: `S${index + 1}`, short: `S${index + 1}`, title: `Phase ${index + 2}`, description: '' });
        } else {
            workflow.push({ type: 'state', key: 'DONE', short: 'DONE', title: 'Done', description: 'Complete' });
        }
    });
    
    return workflow;
}

// Get all states from workflow
function getStates() {
    const workflow = getWorkflow();
    return workflow.filter(item => item.type === 'state');
}

// Get all milestones from workflow
function getMilestones() {
    const workflow = getWorkflow();
    return workflow.filter(item => item.type === 'milestone');
}

// Get state by key
function getStateByKey(key) {
    const states = getStates();
    return states.find(s => s.key === key) || null;
}

// Get milestone by key
function getMilestoneByKey(key) {
    const milestones = getMilestones();
    return milestones.find(m => m.key === key) || null;
}

// Get the state that follows a given milestone
function getStateAfterMilestone(milestoneKey) {
    const workflow = getWorkflow();
    const milestoneIndex = workflow.findIndex(item => item.type === 'milestone' && item.key === milestoneKey);
    if (milestoneIndex === -1) return null;
    
    // Find the next state after this milestone
    for (let i = milestoneIndex + 1; i < workflow.length; i++) {
        if (workflow[i].type === 'state') {
            return workflow[i];
        }
    }
    return null;
}

// Get the first state (initial state before any milestone)
function getFirstState() {
    const states = getStates();
    return states[0] || { key: 'NS', short: 'NS', title: 'Not Started', description: '' };
}

// Get the last state (final state)
function getLastState() {
    const states = getStates();
    return states[states.length - 1] || { key: 'DONE', short: 'DONE', title: 'Done', description: '' };
}

// Get non-filterable groups (groups excluded from filters and KPI totals)
function getNonFilterableGroups() {
    return CONFIG.NON_FILTERABLE_GROUPS || [];
}

// Check if a group is non-filterable
function isGroupNonFilterable(groupName) {
    const nonFilterableGroups = getNonFilterableGroups();
    return nonFilterableGroups.includes(groupName);
}

// Check if a deliverable is in a non-filterable group
function isDeliverableNonFilterable(source) {
    return source.group && isGroupNonFilterable(source.group);
}


// Get only filterable deliverables (for KPI stats)
function getFilterableDeliverables() {
    return CONFIG.DELIVERABLES.filter(source => !isDeliverableNonFilterable(source));
}

// Get the first milestone key (typically START)
function getFirstMilestoneKey() {
    const milestones = getMilestones();
    return milestones[0]?.key || 'START';
}

// Get the last milestone key
function getLastMilestoneKey() {
    const milestones = getMilestones();
    return milestones[milestones.length - 1]?.key || 'M4';
}

// Get the next milestone for a deliverable (the one not yet reached)
function getNextMilestone(source) {
    const today = parseDate(getTodayDate());
    const milestones = getMilestones();
    
    for (const milestone of milestones) {
        const milestoneDate = parseDate(getMilestoneDate(source, milestone.key));
        if (milestoneDate && today < milestoneDate) {
            return milestone;
        }
    }
    
    return null; // All milestones passed
}

// ============================================
// DEPENDENCY MANAGEMENT FUNCTIONS
// ============================================

// Get all data sources (all deliverables, regardless of visibility)
function getAllDataSources() {
    return CONFIG.DELIVERABLES;
}

// Get inbound dependencies (tasks this deliverable depends on / is blocked by)
// Normalize a dependency entry to object format
// Supports: string "TaskA" or object { task: "TaskA", from: "M3", to: "M2" }
function normalizeDependency(dep) {
    if (typeof dep === 'string') {
        return { task: dep, from: null, to: null }; // null means use defaults
    }
    return {
        task: dep.task,
        from: dep.from || null,  // Source milestone (defaults to last milestone of blocking task)
        to: dep.to || null       // Target milestone (defaults to first milestone of blocked task)
    };
}

// Get the task name from a dependency (handles both string and object formats)
function getDependencyTaskName(dep) {
    return typeof dep === 'string' ? dep : dep.task;
}

// Get inbound dependencies (tasks this deliverable depends on / is blocked by)
// Returns array of normalized dependency objects
function getInboundDependencies(source) {
    const deps = source.dependencies || [];
    return deps.map(normalizeDependency);
}

// Get inbound dependency task names only (for simple lookups)
function getInboundDependencyNames(source) {
    const deps = source.dependencies || [];
    return deps.map(getDependencyTaskName);
}

// Get outbound dependencies (tasks that depend on this deliverable / are blocked by it)
// Returns array of { task, from, to } where task is the dependent task name
function getOutboundDependencies(source) {
    const allSources = getAllDataSources();
    const dependents = [];
    
    allSources.forEach(s => {
        if (s.dependencies) {
            s.dependencies.forEach(dep => {
                const taskName = getDependencyTaskName(dep);
                if (taskName === source.name) {
                    const normalized = normalizeDependency(dep);
                    // For outbound, we return info about the dependent task
                    dependents.push({
                        task: s.name,           // The task that depends on source
                        from: normalized.from,  // Which milestone of source
                        to: normalized.to       // Which milestone of dependent
                    });
                }
            });
        }
    });
    
    return dependents;
}

// Get outbound dependency task names only (for simple lookups)
function getOutboundDependencyNames(source) {
    return getOutboundDependencies(source).map(d => d.task);
}

// Check if a deliverable has any dependencies (inbound or outbound)
function hasDependencies(source) {
    const inbound = getInboundDependencies(source);
    const outbound = getOutboundDependencies(source);
    return inbound.length > 0 || outbound.length > 0;
}

// Get dependency type for icon display
// Returns: 'inbound' | 'outbound' | 'both' | 'none'
function getDependencyType(source) {
    const inbound = getInboundDependencies(source);
    const outbound = getOutboundDependencies(source);
    
    if (inbound.length > 0 && outbound.length > 0) return 'both';
    if (inbound.length > 0) return 'inbound';
    if (outbound.length > 0) return 'outbound';
    return 'none';
}

// Get the full dependency graph for a deliverable (all connected nodes)
function getDependencyGraph(sourceName) {
    const allSources = getAllDataSources();
    const sourceMap = new Map(allSources.map(s => [s.name, s]));
    const graph = new Set([sourceName]);
    // Edges now contain milestone info: { from, to, fromMilestone, toMilestone }
    const inboundEdges = [];
    const outboundEdges = [];
    
    const source = sourceMap.get(sourceName);
    if (!source) return { nodes: [], inboundEdges: [], outboundEdges: [] };
    
    // Recursively get all inbound dependencies (tasks this depends on, and their dependencies)
    const visitedInbound = new Set();
    function traverseInbound(currentName) {
        if (visitedInbound.has(currentName)) return;
        visitedInbound.add(currentName);
        
        const current = sourceMap.get(currentName);
        if (!current) return;
        
        const deps = getInboundDependencies(current);
        deps.forEach(dep => {
            graph.add(dep.task);
            inboundEdges.push({
                from: dep.task,
                to: currentName,
                fromMilestone: dep.from,  // null = use last milestone
                toMilestone: dep.to       // null = use START
            });
            traverseInbound(dep.task); // Recurse up the chain
        });
    }
    traverseInbound(sourceName);
    
    // Recursively get all outbound dependencies (tasks that depend on this, and what they block)
    const visitedOutbound = new Set();
    function traverseOutbound(currentName) {
        if (visitedOutbound.has(currentName)) return;
        visitedOutbound.add(currentName);
        
        const current = sourceMap.get(currentName);
        if (!current) return;
        
        const dependents = getOutboundDependencies(current);
        dependents.forEach(dep => {
            graph.add(dep.task);
            outboundEdges.push({
                from: currentName,
                to: dep.task,
                fromMilestone: dep.from,  // null = use last milestone
                toMilestone: dep.to       // null = use START
            });
            traverseOutbound(dep.task); // Recurse down the chain
        });
    }
    traverseOutbound(sourceName);
    
    return {
        nodes: Array.from(graph),
        inboundEdges,
        outboundEdges
    };
}

// Active dependency graph state
let activeDependencyGraph = null;

// Toggle dependency graph view
function toggleDependencyGraph(sourceName, event) {
    if (event) {
        event.stopPropagation();
    }
    
    if (activeDependencyGraph === sourceName) {
        // Clicking same item - deactivate
        activeDependencyGraph = null;
    } else {
        // Activate new graph - clear all filters so all dependencies are visible
        activeDependencyGraph = sourceName;

        // Expand all groups that contain nodes in this graph
        const graphNodes = getDependencyGraph(sourceName).nodes;
        expandGroupsForDependencyGraph(graphNodes);

        // Clear filters but preserve view options
        filterState.status = 'ALL';
        filterState.riskOnly = false;
        filterState.search = '';
    }
    
    renderRoadmap();
    
    // Draw arrows after render
    if (activeDependencyGraph) {
        setTimeout(() => drawDependencyArrows(), 50);
    } else {
        clearDependencyArrows();
    }
}

// Clear dependency graph when clicking outside
function clearDependencyGraphOnClickOutside(event) {
    // Don't clear if clicking on: dependency icon, data source row, filter bar, or any button/control
    if (activeDependencyGraph && 
        !event.target.closest('.dependency-icon') && 
        !event.target.closest('.data-source-row') &&
        !event.target.closest('.filter-bar') &&
        !event.target.closest('.filter-toggle') &&
        !event.target.closest('button') &&
        !event.target.closest('select')) {
        activeDependencyGraph = null;
        clearDependencyArrows();
        renderRoadmap();
    }
}

// Draw dependency arrows using SVG overlay
function drawDependencyArrows() {
    if (!activeDependencyGraph) return;
    
    const graph = getDependencyGraph(activeDependencyGraph);
    const container = document.querySelector('.roadmap-content');
    if (!container) return;
    
    // Remove existing SVG overlay
    clearDependencyArrows();
    
    // Create SVG overlay
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'dependency-arrows-svg';
    // Allow pointer events on children (for tooltips) but not on the SVG itself
    svg.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;';
    svg.setAttribute('pointer-events', 'none');  // SVG container doesn't capture events
    
    // Add arrow marker definitions
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    
    // Inbound arrow marker (blue)
    const inboundMarker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    inboundMarker.setAttribute('id', 'arrowhead-inbound');
    inboundMarker.setAttribute('markerWidth', '10');
    inboundMarker.setAttribute('markerHeight', '7');
    inboundMarker.setAttribute('refX', '9');
    inboundMarker.setAttribute('refY', '3.5');
    inboundMarker.setAttribute('orient', 'auto');
    const inboundPath = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    inboundPath.setAttribute('points', '0 0, 10 3.5, 0 7');
    inboundPath.setAttribute('fill', '#3498db');
    inboundMarker.appendChild(inboundPath);
    defs.appendChild(inboundMarker);
    
    // Outbound arrow marker (orange)
    const outboundMarker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    outboundMarker.setAttribute('id', 'arrowhead-outbound');
    outboundMarker.setAttribute('markerWidth', '10');
    outboundMarker.setAttribute('markerHeight', '7');
    outboundMarker.setAttribute('refX', '9');
    outboundMarker.setAttribute('refY', '3.5');
    outboundMarker.setAttribute('orient', 'auto');
    const outboundPath = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    outboundPath.setAttribute('points', '0 0, 10 3.5, 0 7');
    outboundPath.setAttribute('fill', '#e67e22');
    outboundMarker.appendChild(outboundPath);
    defs.appendChild(outboundMarker);
    
    svg.appendChild(defs);
    
    // Get container bounds for positioning
    const containerRect = container.getBoundingClientRect();
    
    // Helper to get row element by name
    function getRowElement(name) {
        const rows = container.querySelectorAll('.data-source-row');
        for (const row of rows) {
            const nameEl = row.querySelector('.source-name-text');
            if (nameEl && nameEl.textContent.trim() === name) {
                return row;
            }
        }
        return null;
    }
    
    // Get months for position calculation
    const months = generateMonths();
    const lastMilestoneKey = getLastMilestoneKey();
    
    // Helper to get source data by name
    function getSourceByName(name) {
        return getAllDataSources().find(s => s.name === name);
    }
    
    // Helper to draw a finish-to-start arrow between two rows
    // Arrow goes from LAST MILESTONE of blocking task to START milestone of blocked task
    // drawArrow now accepts optional specific milestones
    // fromMilestone: specific milestone in source task (null = use last milestone)
    // toMilestone: specific milestone in target task (null = use START)
    function drawArrow(fromName, toName, fromRow, toRow, color, markerId, fromMilestone = null, toMilestone = null) {
        const fromRect = fromRow.getBoundingClientRect();
        const toRect = toRow.getBoundingClientRect();
        
        // Get timeline track elements for positioning
        const fromTrack = fromRow.querySelector('.timeline-track');
        const toTrack = toRow.querySelector('.timeline-track');
        const fromTrackRect = fromTrack ? fromTrack.getBoundingClientRect() : fromRect;
        const toTrackRect = toTrack ? toTrack.getBoundingClientRect() : toRect;
        
        // Get source data to find milestone positions
        const fromSource = getSourceByName(fromName);
        const toSource = getSourceByName(toName);
        
        // Determine which milestones to use
        // Default: from last milestone of source, to first milestone of target
        const firstMilestoneKey = getFirstMilestoneKey();
        const actualFromMilestone = fromMilestone || lastMilestoneKey;
        const actualToMilestone = toMilestone || firstMilestoneKey;
        
        // Get milestone definitions for labels
        const fromMilestoneDef = getMilestoneByKey(actualFromMilestone);
        const toMilestoneDef = getMilestoneByKey(actualToMilestone);
        
        // Calculate X positions based on milestone dates
        let fromXPercent = 100; // Default to end
        let toXPercent = 0; // Default to start
        let fromDateStr = 'N/A';
        let toDateStr = 'N/A';
        let fromVisible = false;
        let toVisible = false;
        const fromMilestoneShort = fromMilestoneDef?.short || actualFromMilestone;
        const toMilestoneShort = toMilestoneDef?.short || actualToMilestone;
        const fromMilestoneTitle = fromMilestoneDef?.title || actualFromMilestone;
        const toMilestoneTitle = toMilestoneDef?.title || actualToMilestone;
        
        if (fromSource) {
            // Get specified milestone date of blocking task
            const milestoneDate = getMilestoneDate(fromSource, actualFromMilestone);
            if (milestoneDate) {
                fromDateStr = formatDateDisplay(milestoneDate);
                // Check if milestone is visible in the timeline
                fromVisible = isDateInRange(milestoneDate, months);
                const pos = calculatePosition(milestoneDate, months);
                fromXPercent = pos !== null ? pos : 100;
            }
        }
        
        if (toSource) {
            // Get specified milestone date of blocked task
            const milestoneDate = getMilestoneDate(toSource, actualToMilestone);
            if (milestoneDate) {
                toDateStr = formatDateDisplay(milestoneDate);
                // Check if milestone is visible in the timeline
                toVisible = isDateInRange(milestoneDate, months);
                const pos = calculatePosition(milestoneDate, months);
                toXPercent = pos !== null ? pos : 0;
            }
        }
        
        // Skip drawing arrow if either milestone is outside the visible timeline
        // (dependency info is still shown in the icon tooltip)
        if (!fromVisible || !toVisible) {
            return;
        }
        
        // Convert percentage to pixel position within timeline track
        const fromTrackWidth = fromTrackRect.width;
        const toTrackWidth = toTrackRect.width;
        
        const fromX = fromTrackRect.left - containerRect.left + (fromTrackWidth * fromXPercent / 100);
        const fromY = fromRect.top - containerRect.top + fromRect.height / 2;
        
        const toX = toTrackRect.left - containerRect.left + (toTrackWidth * toXPercent / 100);
        const toY = toRect.top - containerRect.top + toRect.height / 2;
        
        // Calculate vertical distance
        const vertDist = Math.abs(toY - fromY);
        
        // Use a simple quadratic curve with small control offset
        const curveOffset = Math.min(20, vertDist * 0.15 + 8);
        
        let d;
        if (vertDist < 5) {
            // Nearly same row - straight line
            d = `M ${fromX} ${fromY} L ${toX} ${toY}`;
        } else {
            // Slight curve - use quadratic bezier for simplicity
            const midY = (fromY + toY) / 2;
            const controlX = Math.max(fromX, toX) + curveOffset;
            d = `M ${fromX} ${fromY} Q ${controlX} ${midY}, ${toX} ${toY}`;
        }
        
        // Create a group for the arrow with tooltip
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.style.cursor = 'pointer';
        group.setAttribute('pointer-events', 'auto');
        
        // Create invisible wider path for easier hover
        const hoverPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hoverPath.setAttribute('d', d);
        hoverPath.setAttribute('stroke', 'transparent');
        hoverPath.setAttribute('stroke-width', '14');
        hoverPath.setAttribute('fill', 'none');
        hoverPath.setAttribute('pointer-events', 'stroke');
        group.appendChild(hoverPath);
        
        // Create visible path
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', `url(#${markerId})`);
        path.setAttribute('opacity', '0.8');
        path.setAttribute('pointer-events', 'none');
        group.appendChild(path);
        
        // Add hover effect - thicken line on hover
        group.addEventListener('mouseenter', () => {
            path.setAttribute('stroke-width', '3');
            path.setAttribute('opacity', '1');
        });
        group.addEventListener('mouseleave', () => {
            path.setAttribute('stroke-width', '2');
            path.setAttribute('opacity', '0.8');
        });
        
        // Create tooltip with extended milestone info
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${fromName}\n[${fromMilestoneShort}] ${fromMilestoneTitle}: ${fromDateStr}\n  ↓\n${toName}\n[${toMilestoneShort}] ${toMilestoneTitle}: ${toDateStr}`;
        group.appendChild(title);
        
        svg.appendChild(group);
    }
    
    // Draw inbound arrows (blue - tasks this depends on)
    graph.inboundEdges.forEach(edge => {
        const fromRow = getRowElement(edge.from);
        const toRow = getRowElement(edge.to);
        
        if (fromRow && toRow) {
            drawArrow(edge.from, edge.to, fromRow, toRow, '#3498db', 'arrowhead-inbound', edge.fromMilestone, edge.toMilestone);
        }
    });
    
    // Draw outbound arrows (orange - tasks that depend on this)
    graph.outboundEdges.forEach(edge => {
        const fromRow = getRowElement(edge.from);
        const toRow = getRowElement(edge.to);
        
        if (fromRow && toRow) {
            drawArrow(edge.from, edge.to, fromRow, toRow, '#e67e22', 'arrowhead-outbound', edge.fromMilestone, edge.toMilestone);
        }
    });
    
    // Add SVG to container
    container.style.position = 'relative';
    container.appendChild(svg);
}

// Get milestone date from source (handles both new format and legacy startDate)
function getMilestoneDate(source, milestoneKey) {
    // Check in milestones object first
    if (source.milestones && source.milestones[milestoneKey]) {
        return source.milestones[milestoneKey];
    }
    // Legacy support: startDate maps to START milestone
    if (milestoneKey === 'START' && source.startDate) {
        return source.startDate;
    }
    return null;
}

// ============================================
// UTILITY FUNCTIONS
// ============================================
function escapeHtmlAttr(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// parseDate from roadmap.utils.js

function parseMonthYear(monthYearStr) {
    const [month, year] = monthYearStr.split('/').map(Number);
    return new Date(year, month - 1, 1);
}

// formatDateDisplay, formatShortDate from roadmap.utils.js

function getMonthName(date) {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${months[date.getMonth()]} ${date.getFullYear()}`;
}

function generateMonths() {
    const months = [];
    const start = parseMonthYear(CONFIG.TIMELINE.START_MONTH);
    const end = parseMonthYear(CONFIG.TIMELINE.END_MONTH);
    
    let current = new Date(start);
    while (current <= end) {
        months.push({
            date: new Date(current),
            name: getMonthName(current),
            daysInMonth: new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate()
        });
        current.setMonth(current.getMonth() + 1);
    }
    return months;
}

function calculatePosition(dateStr, months) {
    const date = parseDate(dateStr);
    if (!date) return null;
    
    const timelineStart = months[0].date;
    const timelineEnd = new Date(months[months.length - 1].date);
    timelineEnd.setMonth(timelineEnd.getMonth() + 1);
    
    const totalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
    const daysFromStart = (date - timelineStart) / (1000 * 60 * 60 * 24);
    
    return Math.max(0, Math.min(100, (daysFromStart / totalDays) * 100));
}

function isDateInRange(dateStr, months) {
    const date = parseDate(dateStr);
    if (!date) return false;
    
    const timelineStart = months[0].date;
    const timelineEnd = new Date(months[months.length - 1].date);
    timelineEnd.setMonth(timelineEnd.getMonth() + 1);
    
    return date >= timelineStart && date <= timelineEnd;
}

// Determine current STATE based on milestone dates
// The state is determined by finding the latest milestone that has passed,
// then returning the state that follows that milestone.
function getCurrentStatus(source) {
    const today = parseDate(getTodayDate());
    const milestones = getMilestones();
    
    // Check milestones in reverse order (latest first)
    // The state is the one that comes AFTER the last passed milestone
    for (let i = milestones.length - 1; i >= 0; i--) {
        const milestone = milestones[i];
        const milestoneDate = parseDate(getMilestoneDate(source, milestone.key));
        if (milestoneDate && today >= milestoneDate) {
            // Return the state that follows this milestone
            const nextState = getStateAfterMilestone(milestone.key);
            return nextState ? nextState.key : getLastState().key;
        }
    }
    
    // No milestone has passed yet - return the first state
    return getFirstState().key;
}

function getVisibleDataSources() {
    let sources = CONFIG.DELIVERABLES.filter(source => source.showInTimeline);
    sources = filterDeliverables(sources);

    return sources;
}

// Get all visible sources (without filters, for stats)
function getAllVisibleDataSources() {
    return CONFIG.DELIVERABLES.filter(source => source.showInTimeline);
}

// Calculate Statistics (uses all deliverables, not filtered)
// Now counts by STATES instead of milestones
function calculateStats() {
    // Only count filterable deliverables (exclude non-filterable groups)
    const allSources = getFilterableDeliverables();
    const visibleSources = allSources.filter(source => source.showInTimeline);
    const states = getStates();
    const lastState = getLastState();
    
    // Initialize stats dynamically with states
    const stats = { 
        total: allSources.length,
        visible: visibleSources.length,
        hidden: allSources.length - visibleSources.length,
        atRisk: 0,
        visibleByStatus: {},
        hiddenByStatus: {},
        stateKeys: states.map(s => s.key)
    };
    
    // Initialize state counts
    states.forEach(s => {
        stats[s.key] = 0;
        stats.visibleByStatus[s.key] = 0;
        stats.hiddenByStatus[s.key] = 0;
    });
    
    allSources.forEach(source => {
        const status = getCurrentStatus(source);
        if (stats[status] !== undefined) {
            stats[status]++;
        }
        
        if (source.atRisk) stats.atRisk++;
        
        if (source.showInTimeline) {
            if (stats.visibleByStatus[status] !== undefined) {
                stats.visibleByStatus[status]++;
            }
        } else {
            if (stats.hiddenByStatus[status] !== undefined) {
                stats.hiddenByStatus[status]++;
            }
        }
    });
    
    // Calculate completion percentage (last state = complete/production)
    const lastStateKey = lastState.key;
    stats.completionPercentage = Math.round((stats[lastStateKey] / stats.total) * 100);
    
    // Calculate "advanced" percentage (last 2 states)
    if (states.length >= 2) {
        const secondLastState = states[states.length - 2];
        stats.productionReadyPercentage = Math.round(((stats[secondLastState.key] + stats[lastStateKey]) / stats.total) * 100);
    } else {
        stats.productionReadyPercentage = stats.completionPercentage;
    }
    
    return stats;
}

// Find upcoming milestones (dynamic)
function getUpcomingMilestones() {
    const today = parseDate(getTodayDate());
    const milestones = getMilestones();
    const upcoming = {};
    const visibleSources = getAllVisibleDataSources();
    
    milestones.forEach(m => {
        let nearest = null;
        let nearestDate = null;

        visibleSources.forEach(source => {
            const milestoneDate = getMilestoneDate(source, m.key);
            const date = parseDate(milestoneDate);
            const group = source.group;
            if (isGroupNonFilterable(group)) {
                return;
            }

            if (date && date >= today) {
                if (!nearestDate || date < nearestDate) {
                    nearestDate = date;
                    nearest = { source: source.name, date: milestoneDate, atRisk: source.atRisk };
                }
            }
        });
        
        upcoming[m.key] = nearest;
    });
    
    return upcoming;
}

// Render Functions

        const workflow = getWorkflow();
        const stateIndex = workflow.findIndex(item => item.type === 'state' && item.key === status);
        let stateColor = '#c1c7d0'; // default grey
        // Find the NEXT milestone after this state to get the relevant color
        let foundNext = false;
        for (let i = stateIndex + 1; i < workflow.length; i++) {
            if (workflow[i].type === 'milestone') {
                stateColor = workflow[i].color;
                foundNext = true;
                break;
            }
        }
        // For final state (no next milestone), use a darker shade of the previous milestone's color
        if (!foundNext && stateIndex > 0) {
            for (let i = stateIndex - 1; i >= 0; i--) {
                if (workflow[i].type === 'milestone') {
                    // Darken the color for final state to distinguish from previous state
                    stateColor = darkenColor(workflow[i].color, 0.25);
                    break;
                }
            }
        }
        
        
        // Generate start marker using START milestone date
        // Hide label if position < 2% to avoid overlap with status indicator
        let startMarkerHTML = '';
        const startDate = getMilestoneDate(source, 'START');
        if (startDate && isDateInRange(startDate, months)) {
            const position = calculatePosition(startDate, months);
            const startMilestone = getMilestoneByKey('START');
            const hideLabel = position < 2;
            startMarkerHTML = `
                <div class="milestone-marker start" style="left: ${position}%; background: ${startMilestone?.color || '#6554c0'}; ${hideLabel ? 'min-width: 8px; width: 8px; height: 8px; border-radius: 50%;' : ''}">
                    ${hideLabel ? '' : `<span>${startMilestone?.short || 'GO'}</span><div class="milestone-date">${formatDateDisplay(startDate)}</div>`}
                </div>
            `;
        }
        
        // Generate milestone markers (dynamic) - skip START as it has its own marker
        // Hide label if position < 2% to avoid overlap with status indicator
        const milestonesHTMLArr = milestonesDef.filter(m => m.key !== 'START').map(m => {
            const date = getMilestoneDate(source, m.key);
            
            if (!date || !isDateInRange(date, months)) {
                return '';
            }
            
            const position = calculatePosition(date, months);
            const hideLabel = position < 2;
            
            return `
                <div class="milestone-marker" style="left: ${position}%; background: ${m.color}; ${m.color === '#ffab00' ? 'color: #172b4d;' : ''} ${hideLabel ? 'min-width: 8px; width: 8px; height: 8px; border-radius: 50%;' : ''}">
                    ${hideLabel ? '' : `<span>${m.short}</span><div class="milestone-date">${formatDateDisplay(date)}</div>`}
                </div>
            `;
        }).join('');
        
        // Generate Gantt bar - shows full timeline with colored segments for each phase
        // Works dynamically with any milestone configuration
        // Past portions have full opacity, future portions have reduced opacity
        // Not Started items show full future bar with reduced opacity
        let ganttBarsHTML = '';
        {
            const segments = [];
            
            // Get start date position (using START milestone)
            const startDate = getMilestoneDate(source, 'START');
            const startDatePos = startDate ? calculatePosition(startDate, months) : null;
            
            // Get all milestone positions dynamically
            const milestonePositions = {};
            milestonesDef.forEach(m => {
                const date = getMilestoneDate(source, m.key);
                milestonePositions[m.key] = date ? calculatePosition(date, months) : null;
            });
            
            // Helper function to create a segment, splitting at today if needed
            function createSegment(start, end, color) {
                if (start === null || end === null || end <= start) return;
                
                // If entirely in the past
                if (end <= todayPosition) {
                    segments.push(`<div class="gantt-bar" style="left: ${start}%; width: ${end - start}%; background: ${color};"></div>`);
                }
                // If entirely in the future
                else if (start >= todayPosition) {
                    segments.push(`<div class="gantt-bar gantt-future" style="left: ${start}%; width: ${end - start}%; background: ${color};"></div>`);
                }
                // If spans today - split into two parts
                else {
                    // Past portion (full opacity)
                    const pastWidth = todayPosition - start;
                    if (pastWidth > 0) {
                        segments.push(`<div class="gantt-bar" style="left: ${start}%; width: ${pastWidth}%; background: ${color};"></div>`);
                    }
                    // Future portion (reduced opacity)
                    const futureWidth = end - todayPosition;
                    if (futureWidth > 0) {
                        segments.push(`<div class="gantt-bar gantt-future" style="left: ${todayPosition}%; width: ${futureWidth}%; background: ${color};"></div>`);
                    }
                }
            }
            
            // Generate all segments dynamically based on milestone definitions
            // Each segment from milestone N to milestone N+1 uses milestone N's color
            // First segment (START to first milestone) uses first milestone's color
            for (let i = 0; i < milestonesDef.length; i++) {
                const currentMilestone = milestonesDef[i];
                const currentPos = milestonePositions[currentMilestone.key];
                
                if (i === 0) {
                    // First segment: START to first milestone - use first milestone's color
                    if (currentPos !== null) {
                        const segStart = startDatePos !== null ? startDatePos : Math.max(0, currentPos - 5);
                        createSegment(segStart, currentPos, currentMilestone.color);
                    }
                }
                
                // Segment from current milestone to next milestone
                if (i < milestonesDef.length - 1) {
                    const nextMilestone = milestonesDef[i + 1];
                    const nextPos = milestonePositions[nextMilestone.key];
                    createSegment(currentPos, nextPos, nextMilestone.color);
                }
            }
            
            ganttBarsHTML = segments.join('');
        }
        
        // Risk indicator
        const riskIndicatorHTML = source.atRisk ? 
            `<div class="risk-indicator" title="At Risk">${riskIconSVG}</div>` : '';
        
        // Info link (optional - backwards compatible when link is undefined)
        const infoLinkHTML = (source.link && source.link.trim()) ?
            `<a class="info-link" href="${escapeHtmlAttr(source.link)}" target="_blank" rel="noopener noreferrer" title="More info">${infoIconSVG}</a>` : '';
        
        // Dependency indicator
        const depType = getDependencyType(source);
        const inboundDeps = getInboundDependencies(source);
        const outboundDeps = getOutboundDependencies(source);
        let dependencyIconHTML = '';
        
        if (depType !== 'none') {
            const isActive = activeDependencyGraph === source.name;
            const activeClass = isActive ? 'active' : '';
            let iconSVG = '';
            let tooltip = '';
            
            // Format dependency info with extended milestone details
            // Format dependency info with extended milestone details
            // Default: from last milestone of source, to first milestone of target
            const firstMsKey = getFirstMilestoneKey();
            const formatInboundDep = (dep) => {
                const fromMsKey = dep.from || lastMilestoneKey;
                const toMsKey = dep.to || firstMsKey;
                const fromMsDef = getMilestoneByKey(fromMsKey);
                const toMsDef = getMilestoneByKey(toMsKey);
                const fromShort = fromMsDef?.short || fromMsKey;
                const toShort = toMsDef?.short || toMsKey;
                return `${dep.task} (${fromShort} → ${toShort})`;
            };
            const formatOutboundDep = (dep) => {
                const fromMsKey = dep.from || lastMilestoneKey;
                const toMsKey = dep.to || firstMsKey;
                const fromMsDef = getMilestoneByKey(fromMsKey);
                const toMsDef = getMilestoneByKey(toMsKey);
                const fromShort = fromMsDef?.short || fromMsKey;
                const toShort = toMsDef?.short || toMsKey;
                return `${dep.task} (${fromShort} → ${toShort})`;
            };
            
            if (depType === 'inbound') {
                // Arrow pointing into (blocked by)
                iconSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 3v7H6l6 8 6-8h-3.5V3z"/></svg>`;
                tooltip = `Blocked by:\n${inboundDeps.map(formatInboundDep).join('\n')}`;
            } else if (depType === 'outbound') {

                iconSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 21v-7H18l-6-8-6 8h3.5v7z"/></svg>`;
                tooltip = `Blocks:\n${outboundDeps.map(formatOutboundDep).join('\n')}`;
            } else if (depType === 'both') {

                iconSVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5-5 5 5H7zm0 4l5 5 5-5H7z"/></svg>`;
                tooltip = `Blocked by:\n${inboundDeps.map(formatInboundDep).join('\n')}\n\nBlocks:\n${outboundDeps.map(formatOutboundDep).join('\n')}`;
            }
            
            dependencyIconHTML = `<div class="dependency-icon ${depType} ${activeClass}" title="${tooltip}" onclick="toggleDependencyGraph('${escapeHtmlAttr(source.name)}', event)">${iconSVG}</div>`;
        }
        
        // Dependency highlighting classes
        let dependencyClass = '';
        if (activeDependencyGraph) {
            const graph = getDependencyGraph(activeDependencyGraph);
            if (activeDependencyGraph === source.name) {
                dependencyClass = 'dependency-active';
            } else if (graph.nodes.includes(source.name)) {
                dependencyClass = 'dependency-highlight';
            } else {
                dependencyClass = 'dependency-dimmed';
            }
        }
        
        return `
            <div class="data-source-row ${atRiskClass} ${groupItemClass} ${dependencyClass} ${descopedClass}">
                <div class="source-name ${statusClass}">
                    ${riskIndicatorHTML}
                    <span class="source-name-text">${source.name}</span>
                    ${infoLinkHTML}
                    ${dependencyIconHTML}
                    <span class="status-indicator" style="background: ${stateColor}; ${stateColor === '#ffab00' ? 'color: #172b4d;' : 'color: white;'}" title="${currentState?.title || status}">${currentState?.short || status}</span>
                </div>
                <div class="timeline-track">
                    ${gridLinesHTML}
                    ${filterState.showGantt ? ganttBarsHTML : ''}
                    <div class="today-guide-line" style="left: ${todayPosition}%;"></div>
                    ${startMarkerHTML}
                    ${milestonesHTMLArr}
                </div>
            </div>
        `;
    }
    
    // Chevron SVG for group headers
    const chevronSVG = `<svg class="group-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 01-1.06 0l-7.5-7.5a.75.75 0 011.06-1.06L12 14.69l6.97-6.97a.75.75 0 111.06 1.06l-7.5 7.5z" clip-rule="evenodd" />
    </svg>`;
    
    // Generate data source rows with grouping support
    let dataSourceRowsHTML = '';
    
    if (hasGroups) {
        const { groups, ungrouped } = groupDeliverables(visibleSources);
        const groupOrder = (typeof CONFIG !== 'undefined' && Array.isArray(CONFIG.GROUP_ORDER) && CONFIG.GROUP_ORDER.length) ? CONFIG.GROUP_ORDER : null;
        const sortedGroupNames = groupOrder
            ? Object.keys(groups).sort((a, b) => {
                const i = groupOrder.indexOf(a);
                const j = groupOrder.indexOf(b);
                if (i === -1 && j === -1) return a.localeCompare(b);
                if (i === -1) return 1;
                if (j === -1) return -1;
                return i - j;
            })
            : Object.keys(groups).sort();
        // Render grouped items
        sortedGroupNames.forEach(groupName => {
            const groupSources = groups[groupName];
            const collapsed = groupCollapsedState[groupName] || false;
            const groupStats = getGroupStats(groupSources);
            
            // Group header
            dataSourceRowsHTML += `
                <div class="group-header" onclick="toggleGroup('${escapeHtmlAttr(groupName)}')">
                    <div class="group-header-name">
                        <svg class="group-chevron ${collapsed ? 'collapsed' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 01-1.06 0l-7.5-7.5a.75.75 0 011.06-1.06L12 14.69l6.97-6.97a.75.75 0 111.06 1.06l-7.5 7.5z" clip-rule="evenodd" />
                        </svg>
                        ${groupName}
                        <span class="group-stats">
                            ${groupStats.total} items${groupStats.atRisk > 0 ? ` <span class="group-stats-risk">(${groupStats.atRisk} at risk)</span>` : ''}
                        </span>
                    </div>
                    <div class="group-header-track"></div>
                </div>
            `;
            
            // Group items (if not collapsed)
            if (!collapsed) {
                groupSources.forEach(source => {
                    dataSourceRowsHTML += renderSourceRow(source, true);
                });
            }
        });
        
        // Render ungrouped items at the end
        ungrouped.forEach(source => {
            dataSourceRowsHTML += renderSourceRow(source, false);
        });
    } else {
        // No groups - render all items normally
        visibleSources.forEach(source => {
            dataSourceRowsHTML += renderSourceRow(source, false);
        });
    }
    
    // Helper function for breakdown text
    function getBreakdownText(status) {
        const visible = stats.visibleByStatus[status];
        const hidden = stats.hiddenByStatus[status];
        if (hidden > 0) {
            return `${visible} shown + ${hidden} hidden`;
        }
        return '';
    }
    
    // Config-driven labels for generic usage
    const entityPlural = (CONFIG.ENTITY_LABELS && CONFIG.ENTITY_LABELS.plural) || "Items";
    const entityScopeLabel = (CONFIG.ENTITY_LABELS && CONFIG.ENTITY_LABELS.scopeLabel) || entityPlural.toLowerCase();
    const columnHeaderLabel = (CONFIG.ENTITY_LABELS && (CONFIG.ENTITY_LABELS.columnHeader || CONFIG.ENTITY_LABELS.singular)) || "Item";
    const dashboardTitle = (CONFIG.DASHBOARD_TEXT && CONFIG.DASHBOARD_TEXT.title) || "Roadmap Dashboard";
    const totalSubtitleSuffix = (CONFIG.DASHBOARD_TEXT && CONFIG.DASHBOARD_TEXT.totalSubtitleSuffix) || "in scope";
    
    // Get total visible for filter results display (only count filterable deliverables)
    const allVisible = getAllVisibleDataSources();
    const filterableSources = visibleSources.filter(s => !isDeliverableNonFilterable(s));
    const allFilterableVisible = allVisible.filter(s => !isDeliverableNonFilterable(s));
    const filteredCount = filterableSources.length;
    const totalVisible = allFilterableVisible.length;
    const hasActiveFilters = filterState.status !== 'ALL' || filterState.riskOnly || filterState.search;
    const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
    
    // Build HTML
    const roadmapHTML = `
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">

            <button class="theme-toggle" onclick="toggleTheme()">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />

            <span class="export-note">Export different views for your presentation</span>
        </div>

            <!-- Summary Dashboard Section -->

                        ${dashboardTitle}

                    <div class="header-right">
                        ${stats.atRisk > 0 ? `

                        <div class="today-date-container">
                            <span class="today-date-label">Today:</span>
                            <span class="today-date-value">${formatShortDate(getTodayDate())}</span>
                        </div>
                    </div>
                </div>
                
                <!-- KPI Cards (Dynamic - by STATE) -->
                <div class="kpi-section" style="grid-template-columns: repeat(${1 + statesDef.length}, 1fr);">
                    <div class="kpi-card total">
                        <div class="kpi-value">${stats.total}</div>
                        <div class="kpi-label">Total ${entityPlural}</div>
                        <div class="kpi-sublabel">${totalSubtitleSuffix}</div>
                        ${stats.hidden > 0 ? `<div class="kpi-breakdown">${stats.visible} shown + ${stats.hidden} hidden</div>` : ''}
                    </div>
                    ${statesDef.map((s, index) => {
                        // Get color for this state (from the NEXT milestone in workflow, or darkened previous for final state)
                        let stateColor = '#c1c7d0'; // default grey
                        const stateIndex = workflow.indexOf(s);
                        let foundNext = false;
                        for (let i = stateIndex + 1; i < workflow.length; i++) {
                            if (workflow[i].type === 'milestone') {
                                stateColor = workflow[i].color;
                                foundNext = true;
                                break;

                        // For final state (no next milestone), use a darker shade of the previous milestone's color
                        if (!foundNext && stateIndex > 0) {
                            for (let i = stateIndex - 1; i >= 0; i--) {

                        return `

                <!-- Progress Bar (Dynamic - by STATE) -->

                    </div>
                    <div class="progress-bar-container">

                            const count = stats[s.key] || 0;
                            // Get color for this state (from the NEXT milestone in workflow, or darkened previous for final state)
                            let stateColor = '#c1c7d0'; // default grey
                            const stateIndex = workflow.indexOf(s);
                            let foundNext = false;
                            for (let i = stateIndex + 1; i < workflow.length; i++) {

                                    stateColor = workflow[i].color;
                                    foundNext = true;

                            if (!foundNext && stateIndex > 0) {

                            // Highlight filtered state, fade others when filtering

                            const segmentOpacity = isFiltering ? (isActiveFilter ? '1' : '0.3') : '1';
                            return `<div class="progress-segment" style="width: ${(count / stats.total) * 100}%; background: ${stateColor}; color: ${textColor}; opacity: ${segmentOpacity};">${count > 0 ? count : ''}</div>`;
                        }).join('')}
                    </div>
                    <div class="progress-legend">
                        ${statesDef.map((s, index) => {
                            let stateColor = '#c1c7d0';
                            const stateIndex = workflow.indexOf(s);
                            let foundNext = false;

                <!-- Upcoming Milestones (Dynamic) -->

// Export to PNG Function
function exportToPNG(elementId, fileNamePrefix) {
    const element = document.getElementById(elementId);
    const buttons = document.querySelectorAll('.export-btn');
    
    buttons.forEach(btn => {
        btn.disabled = true;
        btn.style.opacity = '0.6';
    });
    
    html2canvas(element, {
        scale: 2,
        backgroundColor: '#ffffff',
        logging: false,
        useCORS: true
    }).then(canvas => {
        const link = document.createElement('a');
        const today = getTodayDate().replace(/\//g, '-');
        link.download = `${fileNamePrefix}-${today}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        buttons.forEach(btn => {
            btn.disabled = false;
            btn.style.opacity = '1';
        });
        
    }).catch(err => {
        console.error('Export failed:', err);
        buttons.forEach(btn => {
            btn.disabled = false;
            btn.style.opacity = '1';
        });
    });
}

document.addEventListener('DOMContentLoaded', () => {
    renderRoadmap();
    // Add click listener to clear status filter when clicking outside KPI cards
    document.addEventListener('click', clearStatusFilterOnOutsideClick);
    // Add click listener to clear dependency graph when clicking outside
    document.addEventListener('click', clearDependencyGraphOnClickOutside);
});
